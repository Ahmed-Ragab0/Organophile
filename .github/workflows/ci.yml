name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge-functions:
    name: Edge Functions — fmt, lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format check
        working-directory: supabase
        run: deno fmt --check functions/ tests/
      - name: Lint
        working-directory: supabase
        run: deno lint functions/ tests/
      - name: Typecheck
        working-directory: supabase
        run: deno check functions/kashier-webhook/index.ts functions/ukkera-webhook/index.ts
      - name: Signature golden-vector tests
        working-directory: supabase
        run: deno test --allow-read --allow-env tests/

  signature-vectors-are-current:
    name: Golden vectors still match the real query-string package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Regenerates the vectors from the actual npm packages Kashier documents
      # and fails if they drift from what is committed. This is what stops a
      # silent upstream change from breaking signature verification unnoticed.
      - name: Regenerate and diff
        run: |
          cd supabase/tests
          npm init -y >/dev/null 2>&1
          npm i --silent query-string@7.1.3 underscore@1.13.6
          node generate-vectors.js > /tmp/regenerated.json
          diff <(jq -S . kashier-signature-vectors.json) <(jq -S . /tmp/regenerated.json)

  web:
    name: Dashboard — lint + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run lint
      - working-directory: web
        env:
          # Build-time placeholders only. Real values live in Vercel.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
        run: npm run build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
